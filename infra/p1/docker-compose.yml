name: lifebridge-p1

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${P1_POSTGRES_ADMIN_PASSWORD:?P1_POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${P1_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
