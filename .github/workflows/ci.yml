name: Integrated P1 through P4-S2 acceptance CI

on:
  pull_request:
    branches:
      - main
      - dev
      - test
      - data
      - init/research
  push:
    branches:
      - main
      - dev
      - test
      - data
      - "init/**"
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: integrated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-quality:
    name: Windows static, unit, build, and security
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact candidate
        shell: powershell
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) {
            throw "Checked-out SHA does not match the PR head."
          }

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies with narrow build policy
        shell: powershell
        run: pnpm.cmd install --frozen-lockfile

      - name: Run Windows quality checks
        shell: powershell
        run: |
          pnpm.cmd run format:p1:check
          pnpm.cmd run format:p2:backend:check
          pnpm.cmd run format:p3:check
          pnpm.cmd run format:p3-s2:check
          pnpm.cmd run format:p3-s3:check
          pnpm.cmd run format:p4-s1:check
          pnpm.cmd run format:p4-s2:check
          pnpm.cmd run lint
          pnpm.cmd run typecheck
          pnpm.cmd run test:unit
          pnpm.cmd run validate:docs
          pnpm.cmd run validate:config
          pnpm.cmd run validate:secrets
          pnpm.cmd run build

      - name: Audit dependency advisories
        shell: powershell
        run: pnpm.cmd run security:deps

  postgres-browser:
    name: P4-S2 PostgreSQL integration and Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies with narrow build policy
        run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated database credentials
        shell: pwsh
        run: |
          $carePassword = [guid]::NewGuid().ToString('N')
          $identityPassword = [guid]::NewGuid().ToString('N')
          $notificationPassword = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$carePassword"
          Write-Output "::add-mask::$identityPassword"
          Write-Output "::add-mask::$notificationPassword"
          "P1_ADMIN_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
          "P1_CARE_DATABASE_PASSWORD=$carePassword" >> $env:GITHUB_ENV
          "P1_NOTIFICATION_DATABASE_PASSWORD=$notificationPassword" >> $env:GITHUB_ENV
          "P2_ADMIN_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/postgres" >> $env:GITHUB_ENV
          "P2_IDENTITY_DATABASE_PASSWORD=$identityPassword" >> $env:GITHUB_ENV

      - name: Align database URLs with generated owner credentials
        shell: pwsh
        run: |
          "CARE_DATABASE_URL=postgresql://lifebridge_care:$($env:P1_CARE_DATABASE_PASSWORD)@127.0.0.1:5432/lifebridge_care" >> $env:GITHUB_ENV
          "NOTIFICATION_DATABASE_URL=postgresql://lifebridge_notification:$($env:P1_NOTIFICATION_DATABASE_PASSWORD)@127.0.0.1:5432/lifebridge_notification" >> $env:GITHUB_ENV

      - name: Run the P4-S2 Level C campaign
        shell: pwsh
        run: ./scripts/validate-p4-s2.ps1 -UseExistingDatabase -SkipInstall

  integrated-gate:
    name: P1 through P4-S2 full required gate
    if: always()
    needs:
      - windows-quality
      - postgres-browser
    runs-on: ubuntu-latest
    steps:
      - name: Require every acceptance job
        env:
          WINDOWS_RESULT: ${{ needs.windows-quality.result }}
          POSTGRES_BROWSER_RESULT: ${{ needs.postgres-browser.result }}
        run: |
          test "$WINDOWS_RESULT" = "success"
          test "$POSTGRES_BROWSER_RESULT" = "success"
