name: Phase 0 CI

on:
  pull_request:
    branches:
      - main
      - dev
      - test
      - data
      - init/research
  push:
    branches:
      - main
      - dev
      - test
      - data
      - "init/**"
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Windows quality and security
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Phase 0 baseline
        id: baseline
        shell: powershell
        run: |
          $available = Test-Path -LiteralPath package.json -PathType Leaf
          $bootstrapPush = "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main"
          if (-not $available -and -not $bootstrapPush) {
            throw "Phase 0 baseline is missing outside the approved default-branch bootstrap push."
          }
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up pinned pnpm
        if: steps.baseline.outputs.available == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        if: steps.baseline.outputs.available == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        if: steps.baseline.outputs.available == 'true'
        shell: powershell
        run: pnpm.cmd install --frozen-lockfile

      - name: Run Phase 0 validation
        if: steps.baseline.outputs.available == 'true'
        shell: powershell
        run: pnpm.cmd run validate:phase0

      - name: Audit dependency advisories
        if: steps.baseline.outputs.available == 'true'
        shell: powershell
        run: pnpm.cmd run security:deps
